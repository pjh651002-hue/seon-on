<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>선:온 — 마음을 켜는 3분</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════
   선:온 (Seon:ON) — 시안 v3
   기획서 v2 반영:
     ① 회향  ② 꺼지지 않는 28개의 점  ③ 같이 앉기 링크
     ④ 28일 전 내 한 줄  ⑤ 오늘의 한 줄  ⑥ 종소리만 있는 방
     ⑦ 반개(半開)  ⑧ 죽비로 구간 나누기  ⑨ 일곱 번째 점의 한 걸음
   ═══════════════════════════════════════════════════ */
:root{
  --ink:#0B1219; --celadon:#CFDAD2; --celadon-dp:#4F6B5C;
  --gold:#BE9B3E; --gold-soft:#8C7433; --dim:#5C7266; --dim2:#8FA598;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
  --serif-ko:"Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --serif-en:"EB Garamond","Iowan Old Style",Georgia,serif;
  --display:var(--serif-ko);
}
html[lang="en"]{--display:var(--serif-en)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:var(--sans);background:var(--ink);color:var(--celadon);overflow:hidden;-webkit-font-smoothing:antialiased}
.stage{display:none;position:fixed;inset:0;flex-direction:column;justify-content:center;align-items:center;
  padding:max(30px,env(safe-area-inset-top)) 26px max(30px,env(safe-area-inset-bottom));text-align:center}
.stage.on{display:flex}
.stage.scrolls{justify-content:flex-start;overflow-y:auto;text-align:left;-webkit-overflow-scrolling:touch}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

.lang{position:fixed;top:max(16px,env(safe-area-inset-top));right:18px;display:flex;gap:2px;font-size:11.5px;z-index:20}
.lang button{padding:7px 11px;color:#42564B;letter-spacing:.06em;border-bottom:1px solid transparent;transition:color .25s,border-color .25s}
.lang button.sel{color:var(--gold);border-bottom-color:var(--gold-soft)}
.lang.hide{display:none}
.light .lang button{color:#8FA396}
.light .lang button.sel{color:#3E5A49;border-bottom-color:#8FA396}

.mark{font-family:var(--serif-ko);font-size:clamp(36px,12.5vw,56px);letter-spacing:.02em;line-height:1;margin:0}
.mark i{font-style:normal;color:var(--gold)}
html[lang="en"] .mark{font-family:var(--serif-en)}
.sub{font-family:var(--display);font-size:clamp(16px,4.8vw,20px);color:var(--dim2);margin:16px 0 0}
.note{font-size:12.5px;line-height:1.75;color:var(--dim);margin:0;max-width:32ch}

.ignite{margin-top:38px;width:126px;height:126px;border-radius:50%;border:1px solid var(--gold-soft);
  color:var(--celadon);font-family:var(--display);font-size:20px;letter-spacing:.3em;text-indent:.3em;
  transition:border-color .5s,box-shadow .8s,color .5s}
html[lang="en"] .ignite{font-size:18px;letter-spacing:.12em;text-indent:.12em}
.ignite:hover,.ignite:focus-visible{border-color:var(--gold);color:#fff;box-shadow:0 0 44px -8px rgba(190,155,62,.34)}

.tiny{font-size:12px;color:#4E6357;border-bottom:1px solid #2A3C33;padding-bottom:2px}
.tinyrow{display:flex;gap:20px;margin-top:30px;flex-wrap:wrap;justify-content:center}

/* 오늘의 한 줄 */
.daily{position:fixed;left:26px;right:26px;bottom:max(52px,calc(env(safe-area-inset-bottom) + 44px));
  font-family:var(--display);font-size:13.5px;line-height:1.85;color:#41564A;max-width:34ch;margin:0 auto}
.daily b{display:block;font-family:var(--sans);font-size:10.5px;letter-spacing:.18em;color:#32463C;margin-bottom:7px;font-weight:400}
.helpline{position:fixed;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom));font-size:10.5px;color:#2F4239;padding:0 26px}

.about{font-family:var(--display);font-size:16px;line-height:2;color:var(--dim2);text-align:left;max-width:25em;margin:0}
.about+.about{margin-top:14px}

.ask{font-family:var(--display);font-size:clamp(21px,6.4vw,28px);line-height:1.55;margin:0 0 28px;font-weight:400}
.needs{width:100%;max-width:390px;max-height:62vh;overflow-y:auto}
.need{display:block;width:100%;text-align:left;padding:16px 2px;font-size:15.5px;color:var(--celadon);
  border-bottom:1px solid #22323C;transition:color .25s,padding-left .25s}
.need:first-child{border-top:1px solid #22323C}
.need:hover,.need:focus-visible{color:#fff;padding-left:10px}
.need span{display:block;font-size:12.5px;color:var(--dim);margin-top:5px}
.need b{float:right;font-weight:400;font-size:12px;color:#3E5348;padding-top:3px}

.q{width:100%;max-width:360px;margin:0 auto 26px}
.q p{font-family:var(--display);font-size:18px;margin:0 0 16px;line-height:1.55}
input[type=range]{-webkit-appearance:none;width:100%;height:26px;background:none}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:#33454E}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--celadon);margin-top:-10.5px}
input[type=range]::-moz-range-track{height:1px;background:#33454E}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:var(--celadon)}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:2px}

.opt{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:4px 0 6px}
.chip{padding:9px 15px;border:1px solid #2C3E35;border-radius:30px;font-size:13px;color:var(--dim2);transition:all .22s}
.chip.sel{border-color:var(--gold-soft);color:var(--gold);background:rgba(190,155,62,.1)}
.rowlbl{font-size:12.5px;color:#7E9489;margin:22px 0 8px}

.vrow{display:flex;align-items:center;gap:11px;margin:16px 0 4px;font-size:13.5px;color:#7E9489}
.sw{width:44px;height:24px;border-radius:20px;border:1px solid #3A4C42;position:relative;transition:all .25s}
.sw i{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--dim);transition:all .25s}
.sw.on{border-color:var(--gold-soft);background:rgba(190,155,62,.13)}
.sw.on i{left:23px;background:var(--gold)}
.vwarn{font-size:11.5px;color:#4E6357;margin:0 0 18px;max-width:32ch;line-height:1.7}

.go{padding:13px 42px;border:1px solid var(--gold-soft);border-radius:40px;font-family:var(--display);
  font-size:16px;letter-spacing:.09em;transition:all .3s}
.go:hover,.go:focus-visible{border-color:var(--gold);color:#fff}

/* 28일 전 내 한 줄 */
.echo{font-family:var(--display);font-size:14px;line-height:1.9;color:#6E8579;border-left:1px solid var(--gold-soft);
  padding-left:15px;margin:0 0 26px;max-width:30ch;text-align:left}
.echo b{display:block;font-family:var(--sans);font-size:11px;color:#4E6357;font-weight:400;margin-bottom:6px}

/* 실행 */
#practice{background:var(--ink);color:var(--celadon);transition-property:background-color,color;transition-timing-function:linear;transition-duration:0s}
#practice.lit{background:var(--celadon);color:#1D2E25}
.settle{font-family:var(--display);font-size:clamp(18px,5.6vw,23px);line-height:1.85;max-width:22ch;opacity:0;transition:opacity 1.8s ease;white-space:pre-line}
.settle.show{opacity:.85}
.ring-wrap{position:relative;width:206px;height:206px;display:grid;place-items:center}
.ring{position:absolute;inset:0;border-radius:50%;border:1px solid var(--gold);opacity:.5;animation:breathe 10s ease-in-out infinite}
.ring.two{animation-delay:.35s;opacity:.22}
.ring-wrap.step .ring{animation-duration:6s}
@keyframes breathe{0%{transform:scale(.52)}40%{transform:scale(1)}100%{transform:scale(.52)}}
.breath{font-family:var(--display);font-size:15px;letter-spacing:.28em;text-indent:.28em;opacity:.72}
html[lang="en"] .breath{letter-spacing:.14em;text-indent:.14em}
.guide{font-family:var(--display);font-size:clamp(19px,5.9vw,25px);line-height:1.8;margin:46px 0 0;
  max-width:21ch;min-height:5.2em;opacity:0;transition:opacity 2.6s ease;white-space:pre-line}
.guide.show{opacity:1}
.thread{position:fixed;left:0;bottom:0;height:1px;background:var(--gold);width:0;transition:width .9s linear}
.stop{position:fixed;top:max(18px,env(safe-area-inset-top));left:20px;font-size:12.5px;opacity:.42;padding:8px}
@media (prefers-reduced-motion:reduce){.ring{animation:none;transform:scale(.8)}#practice{transition-duration:0s !important}}

/* 밝은 화면 */
.light{background:var(--celadon);color:#1D2E25}
.light .q p{color:#22352B}
.light .ends{color:var(--celadon-dp)}
.light input[type=range]::-webkit-slider-runnable-track{background:#A9B9AD}
.light input[type=range]::-webkit-slider-thumb{background:#2C4136}
.light input[type=range]::-moz-range-track{background:#A9B9AD}
.light input[type=range]::-moz-range-thumb{background:#2C4136}
.light .note{color:#6C7E72}
.light .go{border-color:#2C4136;color:#1D2E25}
.light .go:hover,.light .go:focus-visible{background:#2C4136;color:var(--celadon)}

/* 회향 */
.dedi-h{font-family:var(--display);font-size:clamp(21px,6.4vw,27px);line-height:1.6;margin:0 0 14px}
.dedi-s{font-size:13.5px;color:var(--celadon-dp);line-height:1.8;margin:0 0 30px;max-width:30ch}
.dedi-in{width:100%;max-width:300px;padding:12px 14px;border:0;border-bottom:1px solid #A9B9AD;background:none;
  font-family:var(--display);font-size:17px;color:#1D2E25;text-align:center}
.dedi-in::placeholder{color:#8FA396}
.dedi-row{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin:26px 0 0}

/* 결과 */
.shifts{display:flex;gap:32px;justify-content:center;margin:0 0 26px;flex-wrap:wrap}
.shift{font-family:var(--display);margin:0}
.shift .lbl{display:block;font-size:13px;color:var(--celadon-dp);margin-bottom:8px;font-family:var(--sans)}
.shift b{font-size:clamp(34px,11vw,48px);font-weight:400}
.shift em{font-style:normal;font-size:16px;color:var(--celadon-dp);padding:0 9px}
.bar{width:240px;height:3px;background:#B4C2B8;margin:0 auto 28px;position:relative}
.bar i{position:absolute;inset:0;width:0;background:var(--celadon-dp);transition:width 1.4s ease .3s}
.verdict{font-family:var(--display);font-size:16.5px;color:#2C4136;margin:0 0 26px;max-width:27ch;line-height:1.75}
.again-q{font-family:var(--display);font-size:17.5px;margin:0 0 14px}
.picks{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-bottom:22px}
.pick{padding:10px 16px;border:1px solid #A9B9AD;border-radius:30px;font-size:14px;color:#2C4136;transition:all .2s}
.pick.sel{background:#2C4136;border-color:#2C4136;color:var(--celadon)}
textarea{width:100%;max-width:340px;min-height:58px;padding:13px;border:1px solid #A9B9AD;border-radius:4px;
  background:rgba(255,255,255,.34);font-family:var(--display);font-size:15px;color:#1D2E25;resize:none}
textarea::placeholder{color:#7A8C80}
.next{margin-top:22px;padding:13px 38px;border:1px solid #2C4136;border-radius:40px;font-family:var(--display);
  font-size:15.5px;letter-spacing:.07em;color:#1D2E25;transition:all .25s}
.next:hover,.next:focus-visible{background:#2C4136;color:var(--celadon)}
.medic{font-size:11.5px;color:#6C7E72;margin:24px 0 0;line-height:1.7;max-width:36ch}

/* 열림 */
#open{padding-top:52px;padding-bottom:64px}
.wrap{width:100%;max-width:540px;margin:0 auto}
.lineage{font-size:12px;color:var(--celadon-dp);letter-spacing:.08em;margin:0 0 10px}
.root-h{font-family:var(--display);font-size:clamp(22px,6.6vw,27px);line-height:1.5;margin:0 0 24px}
.root-t{font-family:var(--display);font-size:16.5px;line-height:2;margin:0 0 17px;color:#25382E}
.pull{font-family:var(--display);font-size:18px;line-height:1.85;color:#2C4136;border-left:1px solid var(--gold);
  padding:2px 0 2px 18px;margin:24px 0;white-space:pre-line}
hr{border:0;border-top:1px solid #B4C2B8;margin:34px 0}
.dots-h{font-size:13.5px;color:var(--celadon-dp);margin:0 0 14px}
.dots{display:grid;grid-template-columns:repeat(14,1fr);gap:9px;max-width:370px}
.dot{aspect-ratio:1;border-radius:50%;border:1px solid #A9B9AD}
.dot.lit{background:var(--gold);border-color:var(--gold)}
.never{font-size:12.5px;color:#6C7E72;margin:13px 0 0;line-height:1.8}
.step-box{border:1px solid var(--gold);padding:20px 22px;margin:30px 0 0;background:rgba(190,155,62,.07)}
.step-box p{font-family:var(--display);font-size:16.5px;line-height:1.85;margin:0 0 14px;color:#25382E}
.opts{display:flex;gap:11px;flex-wrap:wrap;margin-top:30px}
.foot{font-size:11.5px;color:#6C7E72;line-height:1.85;margin:34px 0 0}

/* 종소리 방 */
.room-h{font-family:var(--display);font-size:22px;margin:0 0 8px}
.room-s{font-size:13px;color:var(--dim);margin:0 0 34px;max-width:28ch;line-height:1.8}
#roomRun .ring-wrap{margin-bottom:26px}
.room-t{font-family:var(--display);font-size:15px;color:var(--dim2);letter-spacing:.2em}

/* 같이 앉기 */
.count{font-family:var(--display);font-size:clamp(52px,18vw,80px);line-height:1;color:var(--gold);margin:24px 0}
.together-h{font-family:var(--display);font-size:clamp(20px,6vw,25px);line-height:1.6;margin:0 0 10px;max-width:20ch}
</style>
</head>
<body>

<div class="lang" id="lang">
  <button data-l="ko" class="sel">한국어</button>
  <button data-l="en">English</button>
</div>

<!-- 1. 켜기 -->
<section class="stage on" id="wake">
  <h1 class="mark">선<i>:</i>온</h1>
  <p class="sub" data-t="sub"></p>
  <button class="ignite" id="btnIgnite" data-t="ignite"></button>
  <div class="tinyrow">
    <button class="tiny" id="btnAbout" data-t="aboutBtn"></button>
    <button class="tiny" id="btnRoom" data-t="roomBtn"></button>
    <button class="tiny" id="btnPeek" data-t="peek"></button>
  </div>
  <p class="daily" id="daily"></p>
  <p class="helpline" data-t="help"></p>
</section>

<!-- 1-1. 설명 -->
<section class="stage" id="about">
  <div id="aboutBody"></div>
  <button class="go" id="btnAboutBack" style="margin-top:36px" data-t="back"></button>
  <button class="tiny" id="btnAboutListen" style="margin-top:22px" data-t="listen"></button>
</section>

<!-- 2. 무엇이 필요한가 -->
<section class="stage" id="need">
  <h2 class="ask" data-t="ask"></h2>
  <div class="needs" id="needList"></div>
</section>

<!-- 3. 시작 전 -->
<section class="stage scrolls" id="before" style="justify-content:center;text-align:center">
  <div style="width:100%;max-width:380px;margin:auto">
    <p class="echo" id="echo" style="display:none"></p>
    <div class="q">
      <p data-t="qMind"></p>
      <input type="range" id="m0" min="0" max="10" value="5">
      <div class="ends"><span data-t="mindLo"></span><span data-t="mindHi"></span></div>
    </div>
    <div class="q">
      <p data-t="qBody"></p>
      <input type="range" id="b0" min="0" max="10" value="5">
      <div class="ends"><span data-t="bodyLo"></span><span data-t="bodyHi"></span></div>
    </div>
    <p class="rowlbl" data-t="eyesLbl"></p>
    <div class="opt" id="eyes">
      <button class="chip sel" data-e="close" data-t="eyeClose"></button>
      <button class="chip" data-e="half" data-t="eyeHalf"></button>
    </div>
    <div class="vrow" style="justify-content:center">
      <button class="sw on" id="swVoice" role="switch" aria-checked="true"><i></i></button>
      <span data-t="voice"></span>
    </div>
    <p class="vwarn" id="vwarn" style="margin-left:auto;margin-right:auto"></p>
    <button class="go" id="btnGo" data-t="start"></button>
    <div class="tinyrow" style="margin-top:24px">
      <button class="tiny" id="btnTogether" data-t="together"></button>
    </div>
    <p class="note" style="margin:22px auto 0" data-t="beforeNote"></p>
  </div>
</section>

<!-- 3-1. 같이 앉기 대기 -->
<section class="stage" id="waiting">
  <p class="together-h" id="waitH"></p>
  <p class="count" id="count">–</p>
  <p class="note" id="waitNote"></p>
  <button class="tiny" id="btnWaitCancel" style="margin-top:32px" data-t="back"></button>
</section>

<!-- 4. 실행 -->
<section class="stage" id="practice">
  <button class="stop" id="btnStop" data-t="stop"></button>
  <p class="settle" id="settle"></p>
  <div class="ring-wrap" id="ringWrap">
    <div class="ring"></div><div class="ring two"></div>
    <div class="breath" id="breath" aria-live="polite"></div>
  </div>
  <p class="guide" id="guide"></p>
  <div class="thread" id="thread"></div>
</section>

<!-- 5. 직후 문항 -->
<section class="stage light" id="post">
  <div class="q">
    <p data-t="qMind"></p>
    <input type="range" id="m1" min="0" max="10" value="5">
    <div class="ends"><span data-t="mindLo"></span><span data-t="mindHi"></span></div>
  </div>
  <div class="q">
    <p data-t="qBody"></p>
    <input type="range" id="b1" min="0" max="10" value="5">
    <div class="ends"><span data-t="bodyLo"></span><span data-t="bodyHi"></span></div>
  </div>
  <button class="go" id="btnDedi" data-t="see"></button>
  <p class="note" style="margin-top:26px" data-t="postNote"></p>
</section>

<!-- 6. 회향 -->
<section class="stage light" id="dedicate">
  <h2 class="dedi-h" data-t="dediH"></h2>
  <p class="dedi-s" data-t="dediS"></p>
  <input class="dedi-in" id="dediName">
  <div class="dedi-row">
    <button class="pick" id="dediSelf" data-t="dediSelf"></button>
    <button class="pick" id="dediDone" data-t="dediDone"></button>
    <button class="pick" id="dediSkip" data-t="dediSkip"></button>
  </div>
</section>

<!-- 7. 결과 -->
<section class="stage light" id="after">
  <div class="shifts">
    <p class="shift"><span class="lbl" data-t="lblMind"></span><b id="mFrom">5</b><em data-t="arrow"></em><b id="mTo">5</b></p>
    <p class="shift"><span class="lbl" data-t="lblBody"></span><b id="bFrom">5</b><em data-t="arrow"></em><b id="bTo">5</b></p>
  </div>
  <div class="bar"><i id="barFill"></i></div>
  <p class="verdict" id="verdict"></p>
  <p class="again-q" data-t="againQ"></p>
  <div class="picks" id="picks">
    <button class="pick" data-t="pickYes"></button>
    <button class="pick" data-t="pickMaybe"></button>
    <button class="pick" data-t="pickNo"></button>
  </div>
  <textarea id="memo"></textarea>
  <button class="next" id="btnOpen" data-t="next"></button>
  <p class="medic" data-t="medic"></p>
</section>

<!-- 8. 열림 -->
<section class="stage scrolls light" id="open">
  <div class="wrap">
    <p class="lineage" id="lineage"></p>
    <h2 class="root-h" id="rootH"></h2>
    <div id="rootBody"></div>
    <hr>
    <p class="dots-h" id="dotsH"></p>
    <div class="dots" id="dots"></div>
    <p class="never" data-t="never"></p>
    <div id="stepBox"></div>
    <div class="opts">
      <button class="next" style="margin-top:0" id="btnOther" data-t="other"></button>
      <button class="next" style="margin-top:0" id="btnAgain" data-t="home"></button>
    </div>
    <p class="foot" data-t="foot"></p>
  </div>
</section>

<!-- 9. 종소리만 있는 방 -->
<section class="stage" id="room">
  <h2 class="room-h" data-t="roomH"></h2>
  <p class="room-s" data-t="roomS"></p>
  <div class="opt" id="roomPick">
    <button class="chip" data-m="3">3</button>
    <button class="chip" data-m="10">10</button>
    <button class="chip" data-m="25">25</button>
  </div>
  <button class="tiny" id="btnRoomBack" style="margin-top:34px" data-t="back"></button>
</section>

/* ═══ 4. 저장 ═══
   브라우저 저장이 막힌 환경에서도 죽지 않도록 감쌉니다.
   Vercel 배포 시에는 localStorage 가 그대로 동작합니다. ═══ */
const Store={
  mem:null,
  read(){
    if(this.mem) return this.mem;
    try{ this.mem = JSON.parse(localStorage.getItem('seon-on')) || {sessions:[]}; }
    catch(e){ this.mem = {sessions:[]}; }
    if(!this.mem.sessions) this.mem.sessions=[];
    return this.mem;
  },
  save(){ try{ localStorage.setItem('seon-on', JSON.stringify(this.mem)); }catch(e){} }
};

const state={lang:'ko',key:null,m0:5,b0:5,m1:5,b1:5,again:null,peek:false,voice:true,eyes:'close',dedi:null,together:0};
const $=id=>document.getElementById(id);
const t=()=>T[state.lang];
const p=()=>P[state.key][state.lang];

/* ═══ 5. 음성 ═══
   ▸ 직접 녹음 파일로 교체할 때는 say() 안쪽만 바꾸면 됩니다. ═══ */
const Voice={ok:'speechSynthesis' in window,v:{ko:null,en:null},primed:false,
 pick(){if(!this.ok)return;const vs=speechSynthesis.getVoices();
   this.v.ko=vs.find(x=>/^ko/i.test(x.lang))||null;
   this.v.en=vs.find(x=>/^en-GB/i.test(x.lang))||vs.find(x=>/^en/i.test(x.lang))||null;},
 prime(){if(!this.ok||this.primed)return;try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);this.primed=true;}catch(e){}},
 say(x){if(!this.ok||!state.voice||!x)return;try{
   const u=new SpeechSynthesisUtterance(x.replace(/\n/g,' '));
   u.lang=state.lang==='ko'?'ko-KR':'en-GB';
   const v=this.v[state.lang]; if(v)u.voice=v;
   u.rate=state.lang==='ko'?0.74:0.78; u.pitch=0.94; u.volume=0.92;
   speechSynthesis.speak(u);}catch(e){}},
 hush(){if(this.ok){try{speechSynthesis.cancel();}catch(e){}}}};
if(Voice.ok){Voice.pick();speechSynthesis.onvoiceschanged=()=>Voice.pick();}

/* ═══ 6. 소리 — 종성과 죽비 ═══
   종소리가 울리지 않는다는 이야기가 있어 아래를 손봤습니다.
   브라우저는 소리를 함부로 내지 못하게 막아 두고 있어서, 화면을 누른
   그 순간에 오디오를 열어 두지 않으면 몇 초 뒤의 종소리가 나오지 않습니다.
   ═══════════════════════════════════════════════════════════ */
let actx=null, audioWoken=false;

/* iPhone 은 벨소리 끄기 스위치를 내려두면 웹 소리도 함께 꺼집니다.
   재생용으로 선언해 두면 그 스위치와 무관하게 들립니다.
   (Safari 16.4 이상. 없는 브라우저에서는 그냥 넘어갑니다.) */
try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}

function ac(){
  if(!actx){
    const C=window.AudioContext||window.webkitAudioContext;
    if(!C) return null;
    try{ actx=new C(); }catch(e){ return null; }
  }
  if(actx.state==='suspended'){ try{ actx.resume().catch(()=>{}); }catch(e){} }
  return actx;
}

/* 화면을 처음 누를 때 소리를 깨워 둡니다.
   길이 1의 무음을 한 번 흘려보내는 것만으로 잠금이 풀립니다. */
function wakeAudio(){
  if(audioWoken) return;
  const a=ac(); if(!a) return;
  try{
    const b=a.createBuffer(1,1,a.sampleRate);
    const src=a.createBufferSource(); src.buffer=b;
    src.connect(a.destination); src.start(0);
    audioWoken=true;
  }catch(e){}
}
['pointerdown','touchstart','mousedown','keydown'].forEach(ev=>
  document.addEventListener(ev,wakeAudio,{capture:true,passive:true}));

/* 눈을 감고 앉아 있는 동안 화면이 꺼지면 오디오가 멈춥니다.
   돌아왔을 때 다시 깨웁니다. */
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&actx&&actx.state==='suspended'){
    try{ actx.resume().catch(()=>{}); }catch(e){}
  }
});

/* 정확히 '지금'으로 예약하면 놓치는 브라우저가 있어 아주 조금 뒤로 잡습니다. */
const LEAD=0.06;

function bell(g=0.22){ try{ const a=ac(); if(!a) return;
  const T0=a.currentTime+LEAD;
  [[210,1],[420,.42],[631,.18]].forEach(([f,v])=>{
    const o=a.createOscillator(),gn=a.createGain();
    o.type='sine';o.frequency.value=f;
    gn.gain.setValueAtTime(0,T0);
    gn.gain.linearRampToValueAtTime(g*v,T0+.012);
    gn.gain.exponentialRampToValueAtTime(.0001,T0+5.2);
    o.connect(gn).connect(a.destination);o.start(T0);o.stop(T0+5.3);});
 }catch(e){} }
/* 죽비: 짧고 마른 나무 소리. 잡음을 빠르게 감쇠시켜 만든다 */
function juk(g=0.18){ try{ const a=ac(); if(!a) return;
  const T0=a.currentTime+LEAD,n=a.sampleRate*0.12;
  const buf=a.createBuffer(1,n,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,7);
  const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=1750;f.Q.value=1.1;
  const gn=a.createGain();gn.gain.value=g;
  s.connect(f).connect(gn).connect(a.destination);s.start(T0);
 }catch(e){} }

/* ═══ 7. 화면 ═══ */
function show(id){
  document.querySelectorAll('.stage').forEach(s=>s.classList.remove('on'));
  $(id).classList.add('on');
  $('lang').classList.toggle('hide', id==='practice'||id==='roomRun'||id==='waiting');
  document.body.classList.toggle('light', ['post','dedicate','after','open'].includes(id));
  if(id==='open') $('open').scrollTop=0;
}

function applyLang(){
  const L=t();
  document.documentElement.lang=state.lang;
  document.querySelectorAll('[data-t]').forEach(el=>{
    const v=L[el.dataset.t]; if(typeof v==='string') el.innerHTML=v;});
  $('memo').placeholder=L.memoPh;
  $('dediName').placeholder=L.dediPh;
  $('aboutBody').innerHTML=L.about.map(x=>`<p class="about">${x}</p>`).join('');
  $('needList').innerHTML=ORDER.map(k=>{
    const d=P[k][state.lang];
    return `<button class="need" data-k="${k}"><b>${d.len}</b>${d.need}<span>${d.hint}</span></button>`;}).join('');
  document.querySelectorAll('.need').forEach(b=>b.onclick=()=>{state.key=b.dataset.k;openBefore();});
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('sel',b.dataset.l===state.lang));
  $('vwarn').textContent = Voice.ok
    ? (state.lang==='ko'?'기기에 내장된 음성으로 읽어 드립니다. 소리를 켜 주세요. 종소리가 들리지 않으면 아이폰의 벨소리 끄기 스위치를 확인해 주세요.':'Read aloud by the voice built into your device. Please turn the sound on. If you hear no bell on an iPhone, check the ring/silent switch.')
    : (state.lang==='ko'?'이 브라우저는 음성 안내를 지원하지 않습니다. 안내는 글로 나옵니다.':'Spoken guidance is unavailable here. The guidance appears as text.');
  // 오늘의 한 줄 — 한국 시각(UTC+9) 기준 날짜로 정한다.
  // 보는 사람의 시간대를 따라가면 나라마다 다른 줄이 나오므로 기준을 하나로 둔다.
  const arr=DAILY[state.lang];
  const day=Math.floor((Date.now()+9*36e5)/864e5);
  $('daily').innerHTML=`<b>${state.lang==='ko'?'오늘의 한 줄':'A LINE FOR TODAY'}</b>${arr[day%arr.length]}`;
  $('waitH').textContent=L.waitH; $('waitNote').textContent=L.waitNote;
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{Voice.hush();state.lang=b.dataset.l;applyLang();});

/* ═══ 8. 첫 화면 ═══ */
$('btnIgnite').onclick=()=>{state.peek=false;Voice.prime();bell(.14);show('need');};
$('btnPeek').onclick=()=>{state.peek=true;Voice.prime();show('need');};
$('btnAbout').onclick=()=>{Voice.prime();show('about');};
$('btnAboutBack').onclick=()=>{Voice.hush();show('wake');};
$('btnAboutListen').onclick=()=>{Voice.prime();state.voice=true;Voice.say(t().about.join(' '));};
$('btnRoom').onclick=()=>{Voice.prime();show('room');};
$('btnRoomBack').onclick=()=>show('wake');

/* ═══ 9. 시작 전 — 28일 전 내 한 줄, 눈, 음성 ═══ */
function openBefore(){
  const S=Store.read();
  const past=[...S.sessions].reverse().find(s=>s.key===state.key&&s.memo);
  const e=$('echo');
  if(past){
    e.style.display='block';
    e.textContent='';
    const h=document.createElement('b'); h.textContent=t().echoH;
    e.appendChild(h);
    e.appendChild(document.createTextNode('\u201C'+past.memo+'\u201D'));
  }
  else e.style.display='none';
  show('before');
}
document.querySelectorAll('#eyes .chip').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#eyes .chip').forEach(x=>x.classList.remove('sel'));
  b.classList.add('sel'); state.eyes=b.dataset.e;});
const sw=$('swVoice');
sw.onclick=()=>{state.voice=!state.voice;sw.classList.toggle('on',state.voice);
  sw.setAttribute('aria-checked',state.voice);state.voice?Voice.prime():Voice.hush();};
if(!Voice.ok){state.voice=false;sw.classList.remove('on');sw.disabled=true;}

$('btnGo').onclick=()=>{state.m0=+$('m0').value;state.b0=+$('b0').value;Voice.prime();settleThen();};

/* ═══ 10. 같이 앉기 — 서버 없이 주소에 시각을 담는다 ═══ */
$('btnTogether').onclick=()=>{
  const at=Date.now()+180000;  // 3분 뒤
  const url=`${location.origin}${location.pathname}?at=${at}&k=${state.key}&l=${state.lang}`;
  try{ navigator.clipboard.writeText(url); }catch(e){}
  alert(t().linkMade+'\n\n'+url);
  state.together=at; waitRoom();
};
function waitRoom(){
  show('waiting');
  const tick=()=>{
    const left=Math.ceil((state.together-Date.now())/1000);
    if(left<=0){ $('count').textContent='0'; state.m0=5;state.b0=5; settleThen(); return; }
    $('count').textContent=left>60?Math.ceil(left/60)+(state.lang==='ko'?'분':'m'):left;
    timers.push(setTimeout(tick,500));
  }; tick();
}
$('btnWaitCancel').onclick=()=>{clearAll();show('wake');};

/* ═══ 11. 자리 잡기 → 실행 ═══ */
let timers=[];
function clearAll(){timers.forEach(clearTimeout);timers=[];}

function settleThen(){
  const d=p(),st=$('practice'),L=t();
  st.classList.remove('lit');st.style.transitionDuration='0s';
  $('guide').classList.remove('show');$('guide').textContent='';
  $('thread').style.transitionDuration='0s';$('thread').style.width='0';
  $('ringWrap').style.display='none';
  show('practice');
  const eye = state.eyes==='half' ? L.eyeHalfSay : L.eyeCloseSay;
  const s=$('settle'); s.style.display='block';
  s.textContent=d.settle+'\n'+eye+'\n'+L.settleWord;
  requestAnimationFrame(()=>s.classList.add('show'));
  Voice.say(d.spoken+' '+eye+' '+L.settleWord);
  const wait=state.peek?3200:(state.voice?14000:7000);
  timers.push(setTimeout(()=>{
    s.classList.remove('show');
    timers.push(setTimeout(()=>{s.style.display='none';$('ringWrap').style.display='grid';begin();},1300));
  },wait));
}

function begin(){
  const d=p(),conf=P[state.key];
  const total=state.peek?20:conf.sec;
  const st=$('practice'),guide=$('guide'),th=$('thread');
  bell();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    st.style.transitionDuration=total+'s'; st.classList.add('lit');
    th.style.transitionDuration=total+'s'; th.style.width='100%';}));

  const br=$('breath'),wrap=$('ringWrap'),isStep=conf.pace==='step';
  wrap.classList.toggle('step',isStep);
  const words=isStep?(state.lang==='ko'?['닿고','떠나고']:['contact','release'])
                    :(state.lang==='ko'?['들숨','날숨']:['in','out']);
  const span=isStep?[3000,3000]:[4000,6000];
  let ph=0;br.textContent=words[0];
  const cyc=()=>{ph=(ph+1)%2;br.textContent=words[ph];timers.push(setTimeout(cyc,span[ph]));};
  timers.push(setTimeout(cyc,span[0]));

  // 안내문은 700ms 뒤에 바뀌고 서서히 나타난다. 남은 시간이 그만큼도 안 되면
  // 글자가 보이기 전에 끝나므로 아예 예약하지 않는다.
  // 20초 미리보기에서 마지막 두 줄이 그랬다. 3분 이상 수행에는 영향이 없다.
  const FADE=700, MIN_SHOW=1800;
  d.cues.forEach(([at,x])=>{
    const t0=at*total*1000;
    if(t0+FADE+MIN_SHOW>total*1000) return;
    timers.push(setTimeout(()=>{
      guide.classList.remove('show');
      timers.push(setTimeout(()=>{guide.textContent=x;guide.classList.add('show');Voice.say(x);},FADE));
    },t0));});

  // 죽비로 구간을 나눈다 — 6분 이상
  if(!state.peek && total>=360){
    const n=total>=720?3:2;
    for(let i=1;i<n;i++) timers.push(setTimeout(()=>juk(),total*1000*i/n));
  }
  timers.push(setTimeout(done,total*1000));
}
$('btnStop').onclick=()=>{clearAll();Voice.hush();done();};

/* ═══ 12. 직후 문항 → 회향 → 결과 ═══ */
function done(){
  clearAll();Voice.hush();bell(.18);
  timers.push(setTimeout(()=>Voice.say(t().bell),1500));
  $('m1').value=state.m0;$('b1').value=state.b0;
  timers.push(setTimeout(()=>show('post'),2600));
}
$('btnDedi').onclick=()=>{
  Voice.hush();
  state.m1=+$('m1').value;state.b1=+$('b1').value;
  state.dedi=null;$('dediName').value='';
  show('dedicate');
};
$('dediSelf').onclick=()=>{state.dedi=state.lang==='ko'?'나 자신':'myself';result();};
$('dediDone').onclick=()=>{state.dedi=$('dediName').value.trim()||null;result();};
$('dediSkip').onclick=()=>{state.dedi=null;result();};

function result(){
  const L=t();
  $('mFrom').textContent=state.m0;$('mTo').textContent=state.m1;
  $('bFrom').textContent=state.b0;$('bTo').textContent=state.b1;
  $('barFill').style.width=(state.m1*10)+'%';
  const dm=(state.m1-state.m0)+(state.b1-state.b0);
  let v = dm>0?L.verdict.up:(dm<0?L.verdict.down:L.verdict.same);
  if(state.dedi) v = L.dedicated(state.dedi)+' '+v;
  $('verdict').textContent=v;
  show('after');
}
const AGAIN={pickYes:'yes',pickMaybe:'maybe',pickNo:'no'};
document.querySelectorAll('#picks .pick').forEach(b=>{
  b.onclick=()=>{document.querySelectorAll('#picks .pick').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');state.again=AGAIN[b.dataset.t]||null;};
});

/* ═══ 13. 열림 — 뿌리, 꺼지지 않는 점, 일곱 번째의 한 걸음 ═══ */
$('btnOpen').onclick=()=>{
  const d=p(),L=t(),S=Store.read();
  S.sessions.push({key:state.key,m:[state.m0,state.m1],b:[state.b0,state.b1],
    memo:$('memo').value.trim()||null, dedi:state.dedi, again:state.again, at:Date.now()});
  Store.save();
  $('lineage').textContent=d.lineage;
  $('rootH').textContent=d.rootH;
  $('rootBody').innerHTML=`<p class="root-t">${d.body[0]}</p>`
    +`<p class="pull">${d.pull}</p>`
    +d.body.slice(1).map(x=>`<p class="root-t">${x}</p>`).join('');
  const n=S.sessions.length;
  $('dotsH').textContent=L.dotsH(Math.min(n,28));
  $('dots').innerHTML=Array.from({length:28},(_,i)=>`<div class="dot${i<n?' lit':''}"></div>`).join('');
  // 일곱 번째에 딱 한 번
  $('stepBox').innerHTML = (n===7)
    ? `<div class="step-box"><p><b>${L.stepH}</b><br>${L.stepP}</p>
       <button class="next" id="btnStep" style="margin-top:4px">${L.stepBtn}</button></div>` : '';
  if(n===7) $('btnStep').onclick=()=>{
    window.open('https://www.google.com/maps/search/'+encodeURIComponent(L.stepQuery),'_blank','noopener');
  };
  show('open');
};
function reset(){Voice.hush();clearAll();$('memo').value='';state.again=null;state.dedi=null;
  document.querySelectorAll('#picks .pick').forEach(x=>x.classList.remove('sel'));}
$('btnOther').onclick=()=>{reset();show('need');};
$('btnAgain').onclick=()=>{reset();show('wake');};

/* ═══ 14. 종소리만 있는 방 ═══ */
document.querySelectorAll('#roomPick .chip').forEach(b=>b.onclick=()=>{
  const min=+b.dataset.m; show('roomRun'); bell();
  $('roomT').textContent = min+(state.lang==='ko'?'분':' min');
  const ms=min*60000;
  if(min>=10){const n=min>=25?3:2;for(let i=1;i<n;i++)timers.push(setTimeout(()=>juk(),ms*i/n));}
  timers.push(setTimeout(()=>{bell(.18);timers.push(setTimeout(()=>show('wake'),4000));},ms));
});
$('btnRoomStop').onclick=()=>{clearAll();show('wake');};

/* ═══ 15. 시작 ═══ */
applyLang();
(function fromLink(){
  const q=new URLSearchParams(location.search);
  const at=+q.get('at');
  if(at && at-Date.now()>0 && at-Date.now()<1800000){
    state.key=q.get('k')&&P[q.get('k')]?q.get('k'):'calm';
    if(q.get('l')==='en'){state.lang='en';applyLang();}
    state.together=at; Voice.prime(); waitRoom();
  }
})();
</script>
